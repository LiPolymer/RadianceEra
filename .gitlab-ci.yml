stages:
  - build

build_job:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: '($CI_COMMIT_MESSAGE !~ /^doc:.*/ && $CI_COMMIT_DESCRIPTION !~ /!noCi/ && $CI_COMMIT_MESSAGE !~ /^chore:.*/) || $CI_COMMIT_DESCRIPTION =~ /!forceCi/'
  script:
    - 'chmod +x ./srdk'
    - './srdk build'
    - './srdk build_offline'
  artifacts:
    expire_in: 1 week
    paths:
      - 'build/*.mrpack'
